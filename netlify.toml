# Netlify Configuration for Association Lokho Ndéye
# Security-hardened production deployment

[build]
  publish = "."

# Global Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    # Enforce HTTPS with long duration & preload eligibility
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Clickjacking protection: only allow same origin frames
    X-Frame-Options = "SAMEORIGIN"

    # Prevent browser MIME-type sniffing
    X-Content-Type-Options = "nosniff"

    # XSS filter activation
    X-XSS-Protection = "1; mode=block"

    # Referrer policy protecting visitor privacy
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Restrict unnecessary device hardware & sensors
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"

    # Content Security Policy (CSP) for secure asset loading
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; media-src 'self' data: https: blob:; connect-src 'self' https:; frame-ancestors 'self';"

# Long-term caching for static media assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache policy for CSS & JS
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
